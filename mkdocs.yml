site_name: Stationeers Server UI
site_description: Run a Stationeers dedicated server with a simple setup wizard, web interface, backups, updates and Discord controls.
site_url: https://ssui.dev/
site_author: JacksonTheMaster, The SSUI Team

docs_dir: docs

repo_name: SteamServerUI/StationeersServerUI
repo_url: https://github.com/SteamServerUI/StationeersServerUI

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/ssui-logo.webp
  favicon: assets/ssui-logo.webp
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.prune
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - header.autohide
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
  - javascripts/downloads.js

edit_uri: edit/nightly/docs/

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SteamServerUI/StationeersServerUI
      name: SSUI on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/8n3vN92MyJ
      name: SSUI Discord

copyright: Stationeers Server UI is community-built software for Stationeers dedicated servers.

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - toc:
      permalink: true

