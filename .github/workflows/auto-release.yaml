name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v5.14.1
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          if [ "$TAG" != "v5.14.1" ]; then
            echo "This bridge workflow only builds v5.14.1"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build bridge assets
        run: go run ./build/build.go

      - name: Add legacy updater names
        run: |
          cp build/StationeersServerUI_v5.14.1_windows_amd64.exe build/StationeersServerControlv5.14.1.exe
          cp build/StationeersServerUI_v5.14.1_linux_amd64 build/StationeersServerControlv5.14.1.x86_64

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: build/StationeersServer*
          fail_on_unmatched_files: true
